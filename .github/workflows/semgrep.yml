name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 3 * * 3'

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep Security + Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep security mode
        continue-on-error: true
        run: semgrep scan --config p/security-audit --config p/typescript --config p/secrets --sarif --output semgrep-security.sarif || true

      - name: Run Semgrep quality mode
        continue-on-error: true
        run: semgrep scan --config p/code-quality --config p/bug-prone --config p/typescript --sarif --output semgrep-quality.sarif || true

      - name: Upload Security SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-security.sarif
          category: security

      - name: Upload Quality SARIF to Code tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-quality.sarif
          category: code-quality
