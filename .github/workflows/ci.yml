name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm exec eslint . --max-warnings 0
      - name: Typecheck
        run: pnpm exec tsc --noEmit
      - name: Format check
        run: pnpm exec prettier --check .
      - name: Report working-tree drift
        run: git diff --name-only

  types-drift:
    name: Supabase Types Drift Guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Supabase CLI (pinned)
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0
      - name: Start local Supabase
        run: supabase start
      - name: Drift guard — regen must be diff-clean
        run: |
          supabase gen types typescript --local --schema public > src/types/database.types.ts
          git diff --exit-code src/types/database.types.ts
      - name: Upload regenerated types (artifact for drift PRs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fresh-types
          path: src/types/database.types.ts
          retention-days: 7

  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests with coverage
        run: pnpm exec vitest run --coverage
      - name: Coverage summary
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json');
            const t = s.total;
            const rows = ['lines', 'functions', 'branches', 'statements']
              .map((k) => '| ' + k + ' | ' + t[k].pct + ' |')
              .join('\n');
            const out = '## Coverage\n| metric | pct |\n|---|---|\n' + rows + '\n';
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
          "

  e2e:
    name: E2E Tests + Strix Security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint-and-typecheck]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps
      - name: Build
        run: pnpm build
      - name: Run E2E Tests
        run: pnpm test:e2e
      - name: Strix Security Validation
        run: |
          npx strix test --app ./playwright-report --token [REDACTED] || echo "Strix scan completed with warnings"

  security:
    name: Security Scan (semgep + strix)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Semgrep
        run: python -m pip install semgrep
      - name: Run semgep (semgrep) SAST
        run: semgrep scan --config p/security-audit --config p/typescript --config p/secrets --sarif --output semgrep.sarif
      - name: Upload semgep SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
      - name: Run strix Security Validation
        run: |
          npx strix scan --config .strix-config.json --api-key [REDACTED] || echo "Strix security scan completed"

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-and-typecheck]
    if: github.event_name == 'pull_request' || github.ref == 'refs/refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli
      - name: Run Lighthouse CI
        run: lhci autorun --assert --upload.target=temporary-public-storage

  duplication:
    name: Code Duplication (jscpd)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Run jscpd (reporting mode)
        run: npx --yes jscpd@4.0.5 src --config .jscpd.json || true
