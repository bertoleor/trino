name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '45 2 * * 3'

permissions:
  contents: read
  security-events: write

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv-scanner:
    name: OSV-Scanner (deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install OSV-Scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/google/osv-scanner/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan lockfiles and manifests (reporting mode)
        run: |
          osv-scanner scan source -r . --format sarif --output osv.sarif --github-actions || true

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv.sarif

  trivy:
    name: Trivy (vulns, secrets, IaC, licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan repository (reporting mode)
        run: |
          trivy fs . \
            --scanners vuln,secret,misconfig,license \
            --format sarif --output trivy.sarif || true
          trivy fs . \
            --scanners vuln,secret,misconfig,license \
            --format table --output trivy.txt || true

      - name: Upload SARIF to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif

      - name: Upload full report artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: |
            trivy.sarif
            trivy.txt
          retention-days: 14
