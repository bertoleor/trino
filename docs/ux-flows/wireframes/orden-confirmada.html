<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orden Confirmada — Wireframe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #e0e0e0;
      display: flex;
      justify-content: center;
      padding: 20px 0;
    }
    .wf-screen {
      width: 375px;
      min-height: 667px;
      background: #f5f5f5;
      border: 2px dashed #ccc;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .wf-header {
      background: #e8e8e8;
      border-bottom: 1px dashed #ccc;
      padding: 12px 16px;
      font-size: 18px;
      font-weight: 600;
      color: #444;
      text-align: center;
    }
    .wf-nav {
      background: #e8e8e8;
      border-bottom: 1px dashed #ccc;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: #666;
    }
    .wf-content {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .wf-input {
      border: 1px dashed #ccc;
      background: #fff;
      padding: 12px;
      font-size: 14px;
      color: #999;
      border-radius: 4px;
    }
    .wf-button {
      background: #ccc;
      border: 1px dashed #999;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #444;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
    }
    .wf-button-secondary {
      background: transparent;
      border: 1px dashed #999;
      padding: 14px;
      font-size: 16px;
      color: #666;
      text-align: center;
      border-radius: 4px;
      cursor: pointer;
    }
    .wf-card {
      background: #fff;
      border: 1px dashed #ccc;
      border-radius: 4px;
      padding: 16px;
    }
    .wf-list-item {
      background: #fff;
      border: 1px dashed #ccc;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      color: #666;
    }
    .wf-list-item + .wf-list-item {
      border-top: none;
    }
    .wf-tab-bar {
      background: #e8e8e8;
      border-top: 1px dashed #ccc;
      padding: 8px 0;
      display: flex;
      justify-content: space-around;
      margin-top: auto;
    }
    .wf-tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #888;
    }
    .wf-tab-item.active {
      color: #444;
    }
    .wf-icon-placeholder {
      width: 24px;
      height: 24px;
      background: #ddd;
      border: 1px dashed #bbb;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .wf-icon-placeholder.large {
      width: 48px;
      height: 48px;
    }
    .wf-text-placeholder {
      background: #e0e0e0;
      height: 12px;
      border-radius: 2px;
    }
    .wf-text-placeholder.short { width: 40%; }
    .wf-text-placeholder.medium { width: 70%; }
    .wf-text-placeholder.full { width: 100%; }
    .wf-divider {
      border: none;
      border-top: 1px dashed #ccc;
      margin: 4px 0;
    }
    .wf-spacer {
      height: 16px;
    }
    .wf-label {
      font-size: 12px;
      color: #888;
      font-weight: 500;
    }
    .wf-title {
      font-size: 20px;
      font-weight: 600;
      color: #444;
    }
    .wf-subtitle {
      font-size: 14px;
      color: #888;
    }
    .wf-footer {
      font-size: 10px;
      color: #aaa;
      text-align: center;
      padding: 8px;
      border-top: 1px dashed #ddd;
    }
    a.wf-link {
      color: inherit;
      text-decoration: none;
      display: contents;
    }
    a.wf-link:hover {
      opacity: 0.7;
    }
    a.wf-link:active {
      opacity: 0.5;
    }
    .wf-back {
      font-size: 14px;
      color: #666;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wf-screen">
    <!-- Nav bar with back button — adjust href to the previous screen -->
    <div class="wf-nav">
      <a href="tienda.html" class="wf-link">
        <span class="wf-back">← Back</span>
      </a>
      <span>Orden Confirmada</span>
      <span></span>
    </div>

    <!-- Header (optional — use when the screen needs a prominent title) -->
    <div class="wf-header">
      Orden Confirmada
    </div>

    <!-- Main content area — replace with screen-specific elements -->
    <div class="wf-content">
      <div class="wf-label">Form fields (if any):</div>
      <div class="wf-input">Text input placeholder</div>
      <div class="wf-input">Email input placeholder</div>

      <!-- Primary action button — wrap in <a> to link to the next screen -->
      <a href="tienda.html" class="wf-link">
        <div class="wf-button">
          Go to Target Screen
        </div>
      </a>

      <hr class="wf-divider">

      <!-- List items — each one can be a link to a detail screen -->
      <div class="wf-label">List items:</div>
      <a href="tienda.html" class="wf-link">
        <div class="wf-list-item">
          <div class="wf-icon-placeholder"></div>
          <span>Item label — links to detail</span>
        </div>
      </a>
      <a href="tienda.html" class="wf-link">
        <div class="wf-list-item">
          <div class="wf-icon-placeholder"></div>
          <span>Another item</span>
        </div>
      </a>

      <!-- Card example — wrap in <a> to make tappable -->
      <a href="tienda.html" class="wf-link">
        <div class="wf-card">
          <div class="wf-title">Card title</div>
          <div class="wf-text-placeholder full" style="margin-top:8px"></div>
          <div class="wf-text-placeholder medium" style="margin-top:4px"></div>
        </div>
      </a>
    </div>

    <!-- Tab bar — keep consistent across screens that share it -->
    <div class="wf-tab-bar">
      <a href="tienda.html" class="wf-link">
        <div class="wf-tab-item active">
          <div class="wf-icon-placeholder"></div>
          <span>Home</span>
        </div>
      </a>
      <a href="tienda.html" class="wf-link">
        <div class="wf-tab-item">
          <div class="wf-icon-placeholder"></div>
          <span>Search</span>
        </div>
      </a>
      <a href="tienda.html" class="wf-link">
        <div class="wf-tab-item">
          <div class="wf-icon-placeholder"></div>
          <span>Profile</span>
        </div>
      </a>
    </div>

    <!-- Footer metadata — identifies this wireframe -->
    <div class="wf-footer">
      Orden Confirmada — UC-004, UC-005
    </div>
  </div>
</body>
</html>
